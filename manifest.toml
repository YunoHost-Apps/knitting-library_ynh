#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "knitting-library"
name = "Knitting Library"
description.en = "Personal knitting pattern manager."

version = "0.9.6~ynh1"

maintainers = ["Thovi98"]

[upstream]
license = "MIT"
code = "https://github.com/ZeetLex/knitting-library"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    # this is a generic question - ask strings are automatically handled by YunoHost's core
    type = "domain"

    [install.path]
    # this is a generic question - ask strings are automatically handled by YunoHost's core
    type = "path"
    default = "/example"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    help.en = "Admin password"
    type = "password"

[resources]
    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/ZeetLex/knitting-library/archive/refs/tags/0.9.6.tar.gz"
    sha256 = "60ce104076cd00b050dd1c0524e0e5b379ad17299e954e7a1f3bea46b75bc3b5"

    autoupdate.strategy = "latest_github_release"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "python3, python3-venv"

    [resources.nodejs]
    version = "24"
